# .tmux.conf
# Author: Oli Osvaldsson <oli.osvaldsson@epicgames.com>
# Source: https://github.ol.epicgames.net/oli-osvaldsson/dotfiles/.tmux.conf

# Set the default terminal with true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Use a different action key
set-option -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Start numbering windows at 1
set-option -g base-index 1

# Enable mouse support (modern syntax)
set -g mouse on

# Set the status bar refresh interval
set -g status-interval 5

# Set status bar (modern syntax)
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green]#H"

# Add session information and increase the length to 50
set -g status-right "#[fg=yellow]#(uptime | cut -d ',' -f 3-)"
set -g status-right-length 50

# Set window notificatins
setw -g monitor-activity on
set -g visual-activity on

# Automatically set window title
setw -g automatic-rename

# Change the binding of split-window key
unbind %    # Remove default binding since we're replacing
bind s split-window -h
bind v split-window -v

# Enable vi mode keys
setw -g mode-keys vi
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# Modern vi-copy key bindings
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Modern clipboard functionality
# move x clipboard into tmux paste buffer
bind C-p run "tmux set-buffer \"$(xclip -o -selection clipboard)\"; tmux paste-buffer"
# move tmux copy buffer into x clipboard
bind C-y run "tmux save-buffer - | xclip -i -selection clipboard" \; display-message "Buffer copied to clipboard"

# Use the vim motion keys to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use the vim resize keys.
# The number at the end is how much the pane will be resized
# and 1 is fairly small -- you might want to tweak this
bind < resize-pane -L 6
bind > resize-pane -R 6
bind - resize-pane -D 3
bind + resize-pane -U 3

# Smart pane switching with vim-style navigation (using prefix key)
bind C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"
bind 'C-\' run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys 'C-\\') || tmux select-pane -l"

# Additional modern improvements
# Start pane numbering at 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 10000

# Reduce escape time for faster vim response
set -sg escape-time 10

# Reload .tmux.conf on request
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
